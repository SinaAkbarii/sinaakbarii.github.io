<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta id="theme-color-meta" name="theme-color" content="#FFFFFF">

  <script>
    (function () {
      var theme = null;
      try {
        theme = localStorage.getItem("sakbari-theme");
      } catch (e) {}

      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }

      document.documentElement.setAttribute("data-theme", theme);
      document.getElementById("theme-color-meta")
        .setAttribute("content", theme === "dark" ? "#15171A" : "#FFFFFF");
    })();
  </script>

  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="stylesheet" href="{{ "/assets/theme.css" | relative_url }}">
  <script src="{{ "/assets/theme.js" | relative_url }}" defer></script>

  {%- feed_meta -%}
